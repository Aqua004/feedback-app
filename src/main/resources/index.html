<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Feedback Form</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #4f46e5, #06b6d4); padding: 24px;
  }
  .card {
    background: #fff; width: 100%; max-width: 480px; padding: 32px;
    border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,.25);
  }
  h2 { margin: 0 0 4px; color: #1e293b; text-align: center; }
  .sub { text-align: center; color: #64748b; margin: 0 0 24px; font-size: 14px; }
  label.title { display: block; margin: 16px 0 6px; font-weight: 600; color: #334155; font-size: 14px; }
  input[type=text], input[type=email], select, textarea {
    width: 100%; padding: 11px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px;
    font-size: 15px; font-family: inherit; transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.2);
  }
  textarea { resize: vertical; }
  .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; }
  .stars input { display: none; }
  .stars label { font-size: 32px; color: #cbd5e1; cursor: pointer; transition: color .15s; }
  .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: #f59e0b; }
  button {
    width: 100%; margin-top: 24px; padding: 13px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; font-size: 16px;
    font-weight: 600; cursor: pointer; transition: transform .1s, opacity .2s;
  }
  button:hover { opacity: .92; }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="card">
    <h2>Online Feedback Form</h2>
    <p class="sub">We'd love to hear your thoughts</p>
    <form action="feedback" method="post">
      <label class="title" for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label class="title" for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label class="title" for="category">Feedback Category</label>
      <select id="category" name="category">
        <option>General</option>
        <option>Bug Report</option>
        <option>Suggestion</option>
        <option>Appreciation</option>
      </select>

      <label class="title">Rating</label>
      <div class="stars">
        <input type="radio" id="r5" name="rating" value="5"><label for="r5">&#9733;</label>
        <input type="radio" id="r4" name="rating" value="4"><label for="r4">&#9733;</label>
        <input type="radio" id="r3" name="rating" value="3" checked><label for="r3">&#9733;</label>
        <input type="radio" id="r2" name="rating" value="2"><label for="r2">&#9733;</label>
        <input type="radio" id="r1" name="rating" value="1"><label for="r1">&#9733;</label>
      </div>

      <label class="title" for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="4" placeholder="Tell us more..."></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
